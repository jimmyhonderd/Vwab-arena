<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VWAB Arena Beheer</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#050505;color:#eaf6ff;font-family:"Barlow Semi Condensed",Bahnschrift,"Arial Narrow",sans-serif;padding:16px;max-width:900px;margin:auto}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;color:#ffd100;letter-spacing:.04em;margin:0 0 12px}
.card{border:1px solid #22e6ff55;padding:14px;margin-bottom:14px;background:#0a0f18}
input,button,select{font:600 16px inherit;padding:10px 12px;border-radius:6px;border:1px solid #39ff5a;background:#000;color:#fff}
button{background:#ffd100;color:#000;border:0;cursor:pointer}button.danger{background:#ff3b4a;color:#fff}button.ghost{background:#111;color:#eaf6ff;border:1px solid #444}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px 8px;border-bottom:1px solid #222;text-align:left}td.n{text-align:right;font-variant-numeric:tabular-nums;color:#ffd100}tr.h td{opacity:.4;text-decoration:line-through}
#msg{color:#22e6ff;min-height:1.4em}small{color:#889}
</style>
</head>
<body>
<h1>VWAB ARENA · BEHEER</h1>
<div class="card"><div class="row"><input id="key" type="password" placeholder="Beheersleutel" style="flex:1"><button id="login">Inloggen</button></div><div id="msg"></div></div>
<div class="card" id="panel" hidden>
  <div class="row"><b>Ronde: <span id="round">?</span></b><button id="newround" class="danger">Nieuwe ronde starten (bord leeg)</button><button id="export" class="ghost">Export CSV</button><button id="refresh" class="ghost">Vernieuwen</button></div>
  <div class="row"><input id="verify" placeholder="Claimcode (5 tekens)" maxlength="5" style="text-transform:uppercase"><button id="verifybtn">Verify</button><span id="vres"></span></div>
  <div class="row"><input id="hidename" placeholder="Naam verbergen (alle scores)"><button id="hidebtn" class="danger">Verberg naam</button></div>
  <div class="row"><input id="rfrom" type="number" placeholder="id van" style="width:110px"><input id="rto" type="number" placeholder="id t/m" style="width:110px"><button id="rangebtn" class="danger">Verberg reeks</button></div>
  <small>Verbergen is omkeerbaar per score (knop in de lijst). Een nieuwe ronde bewaart de oude scores; ze tellen alleen niet meer mee op het bord.</small>
  <table><thead><tr><th>#</th><th>Naam</th><th class="n">Score</th><th>Code</th><th>Duur</th><th>Tijd</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  <div class="row"><button id="more" class="ghost">Ouder laden</button><small id="cnt"></small></div>
</div>
<script>
(async()=>{
let API=''; try{ API=(await (await fetch('config.json',{cache:'no-store'})).json()).api; }catch(_){}
const $=id=>document.getElementById(id); const game='invasie';
let KEY=sessionStorage.getItem('vwab-admin')||''; if(KEY){ $('key').value=KEY; }
const call=async(p,opt={})=>{ const r=await fetch(API+p,{...opt,headers:{'Content-Type':'application/json','X-Admin-Key':KEY,...(opt.headers||{})}}); return r; };
let allRows=[]; async function load(before){ const r=await call('/admin/list?game='+game+(before?'&before='+before:'')); if(r.status===401){ $('msg').textContent='Sleutel onjuist.'; $('panel').hidden=true; return; } const d=await r.json(); $('round').textContent=d.round; $('panel').hidden=false; $('msg').textContent='Ingelogd. Service: '+API; allRows = before ? allRows.concat(d.rows) : d.rows; $('cnt').textContent=allRows.length+' van '+d.total+' geladen'; $('more').hidden=d.rows.length<500;
  $('rows').innerHTML=allRows.map((e,i)=>`<tr class="${e.hidden?'h':''}"><td>${e.id}</td><td>${e.name}</td><td class="n">${e.score}</td><td><code>${e.claim||''}</code></td><td>${e.dur}s</td><td>${new Date(e.ts).toLocaleTimeString('nl-NL')}</td><td><button class="ghost" data-id="${e.id}" data-un="${e.hidden?1:0}">${e.hidden?'Toon':'Verberg'}</button> <button class="danger" data-dev="${e.id}" title="Alle scores van dit toestel verbergen">Toestel</button></td></tr>`).join('');
  $('rows').querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{ await call('/admin/hide',{method:'POST',body:JSON.stringify({id:+b.dataset.id,unhide:b.dataset.un==='1'})}); load(); });
  $('rows').querySelectorAll('button[data-dev]').forEach(b=>b.onclick=async()=>{ if(!confirm('Alle scores van dit toestel verbergen?')) return; const d=await (await call('/admin/hidedev',{method:'POST',body:JSON.stringify({id:+b.dataset.dev})})).json(); $('msg').textContent=(d.changed||0)+' scores verborgen.'; load(); }); }
$('login').onclick=()=>{ KEY=$('key').value.trim(); sessionStorage.setItem('vwab-admin',KEY); load(); };
$('refresh').onclick=()=>load();
$('more').onclick=()=>{ const last=allRows[allRows.length-1]; if(last) load(last.id); };
$('newround').onclick=async()=>{ if(!confirm('Nieuwe ronde starten? Het bord begint leeg.')) return; await call('/admin/newround',{method:'POST'}); load(); };
$('hidebtn').onclick=async()=>{ const n=$('hidename').value.trim(); if(!n) return; await call('/admin/hidename',{method:'POST',body:JSON.stringify({name:n})}); $('hidename').value=''; load(); };
$('verifybtn').onclick=async()=>{ const c=$('verify').value.trim().toUpperCase(); if(!c) return; const d=await (await call('/admin/verify?code='+c)).json(); $('vres').innerHTML = d.ok ? `<b style="color:#39ff5a">✔ KLOPT</b> ${d.row.name} · ${d.row.score} · #${d.rank} in ronde ${d.row.round}${d.row.hidden?' (verborgen)':''}` : '<b style="color:#ff3b4a">✘ onbekende code</b>'; };
$('rangebtn').onclick=async()=>{ const f=+$('rfrom').value,t=+$('rto').value; if(!f||!t) return; if(!confirm(`Scores ${f} t/m ${t} verbergen?`)) return; const d=await (await call('/admin/hiderange',{method:'POST',body:JSON.stringify({from:f,to:t})})).json(); $('msg').textContent=(d.changed||0)+' scores verborgen.'; load(); };
$('export').onclick=async()=>{ const r=await call('/admin/export?game='+game); const b=await r.blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='vwab-arena.csv'; a.click(); };
if(KEY) load();
})();
</script>
</body>
</html>
